    <!-- Mode embarqué détecté AU PLUS TÔT (avant rendu) pour éviter tout flash
         du décor de la page autonome quand /widget?embed=1 est chargé en iframe. -->
    <script>
      var _p = new URLSearchParams(location.search);
      if (_p.get("embed") === "1") {
        document.documentElement.classList.add("sahten-embed");
        // L'iframe fait 412px : sans cette indication, le widget se croit sur
        // un téléphone (seuil mobile 600px) et masque « agrandir » + centre le
        // composeur, alors que le visiteur est sur un écran de bureau.
        if (_p.get("host") === "desktop") {
          document.documentElement.classList.add("sahten-host-desktop");
        }
      }
    </script>

      nav.top {

      /* Mode embarqué (/widget?embed=1) : la page est chargée dans une iframe
         par embed.js sur lorientlejour.com. On efface tout le décor (nav, titre,
         fond blanc) pour ne montrer QUE le panneau de chat, déjà ouvert. Le
         trigger interne est masqué : c'est embed.js qui fournit le bouton sur la
         page hôte. Gardé sous .sahten-embed -> la page /widget autonome est
         strictement inchangée. */
      html.sahten-embed,
      html.sahten-embed body {
        background: transparent !important;
        padding-top: 0 !important;
        min-height: 0 !important;
        display: block !important;
      }
      html.sahten-embed nav.top,
      html.sahten-embed .page-context,
      html.sahten-embed .sahten-trigger,
      html.sahten-embed .sahten-trigger-wrap,
      html.sahten-embed .sahten-drag-handle {
        display: none !important;
      }
      /* MODE FENÊTRE : le panneau REMPLIT l'iframe (embed.js dimensionne
         l'iframe en fenêtre bottom-right et porte l'arrondi + l'ombre). Les
         marges natives laissaient des bandes vides -> « verre dépoli ».
         IMPORTANT : scopé à data-size="window" UNIQUEMENT — en agrandi
         (mid/full) le panneau garde son design natif centré. */
      html.sahten-embed .sahten-widget-container[data-size="window"] {
        position: fixed !important;
        inset: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        height: 100% !important;
        max-height: 100% !important;
        margin: 0 !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        transform: none !important;
      }
      /* MODE AGRANDI : AUCUNE surcharge de géométrie. Quand embed.js passe
         l'iframe en plein écran, le viewport interne redevient large, les
         règles de bureau s'appliquent naturellement et le panneau prend
         exactement la même fenêtre centrée que sur la page /widget autonome.
         Toute valeur recopiée ici finirait par diverger de la référence :
         c'est ce qui s'était produit (980px ici, 1040px là-bas).
         Seule exception irréductible : le flou d'arrière-plan ne peut pas
         traverser une iframe pour atteindre la page hôte, on lui substitue
         donc un voile opaque. */
      html.sahten-embed .sahten-backdrop {
        background: rgba(20, 20, 18, 0.45) !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }
      /* Le panneau doit être visible/opaque d'emblée dans l'iframe (en page
         normale il attend l'ouverture avec opacity:0 — ici un JS qui tarde
         laissait un panneau fantôme). Vaut pour toutes les tailles. */
      html.sahten-embed .sahten-widget-container {
        background: #ffffff !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        opacity: 1 !important;
        visibility: visible !important;
        pointer-events: auto !important;
      }
    </style>

    <script type="module">
      import { SahtenChat } from "./js/sahten.js?v=20260813g";
      /* Production : pas de sélecteur de modèle (réglage côté API / dev uniquement) */
      window.__sahtenChat = new SahtenChat();

    <!-- Pont d'embarquement : n'agit QUE sous ?embed=1 (page autonome intacte).
         Ouvre le chat d'emblée dans l'iframe, et signale la fermeture au parent
         (embed.js) pour masquer l'iframe et rendre le bouton flottant. -->
    <script>
      (function () {
        if (!document.documentElement.classList.contains("sahten-embed")) return;

        function openChat() {
          try {
            if (window.__sahtenChat && typeof window.__sahtenChat.toggle === "function") {
              window.__sahtenChat.toggle(true);
              return true;
            }
          } catch (e) {}
          var t = document.querySelector(".sahten-trigger");
          if (t) { t.click(); return true; }
          return false;
        }

        // Ouvre dès que SahtenChat est prêt (le module est différé).
        var tries = 0;
        var iv = setInterval(function () {
          if (openChat() || ++tries > 60) clearInterval(iv);
        }, 100);

        // Le parent (embed.js) redemande l'ouverture quand on ré-affiche l'iframe.
        window.addEventListener("message", function (e) {
          var d = e.data || {};
          if (d && d.type === "sahten:open") openChat();
        });

        // Chaque changement de taille du panneau est signalé au parent :
        // embed.js étend l'iframe en plein écran transparent quand on agrandit,
        // et la ramène en fenêtre bottom-right quand on réduit.
        var container = document.querySelector(".sahten-widget-container");
        if (container) {
          var lastSize = null;
          var notifySize = function () {
            var size = container.getAttribute("data-size") || "window";
            if (size === lastSize) return;
            lastSize = size;
            try {
              window.parent.postMessage(
                { type: "sahten:size", expanded: size !== "window" }, "*"
              );
            } catch (err) {}
          };
          new MutationObserver(notifySize).observe(container, {
            attributes: true, attributeFilter: ["data-size"],
          });
          notifySize();
        }

        // La fermeture (bouton ×) prévient le parent : masquer l'iframe.
        document.addEventListener(
          "click",
          function (e) {
            if (e.target && e.target.closest && e.target.closest(".sahten-close-btn")) {
              // Réouverture toujours en mode fenêtre : sinon un panneau resté
              // en « full » se retrouverait à l'étroit dans l'iframe-fenêtre.
              try {
                if (window.__sahtenChat) window.__sahtenChat.setSize("window");
              } catch (err) {}
              try { window.parent.postMessage({ type: "sahten:close" }, "*"); } catch (err) {}
            }
          },
          true
        );
      })();
    </script>

    <button
      type="button"
